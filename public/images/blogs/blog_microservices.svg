<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#120E22" />
      <stop offset="100%" stop-color="#08060D" />
    </linearGradient>
    <linearGradient id="card-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <circle cx="600" cy="337" r="280" fill="#7C3AED" opacity="0.15" filter="url(#blur-glow)" />

  <!-- Connecting Nodes Mesh -->
  <g stroke="url(#card-stroke)" stroke-width="2" opacity="0.5">
    <line x1="600" y1="200" x2="350" y2="350" stroke-dasharray="6 6" />
    <line x1="600" y1="200" x2="850" y2="350" stroke-dasharray="6 6" />
    <line x1="350" y1="350" x2="480" y2="500" />
    <line x1="850" y1="350" x2="720" y2="500" />
    <line x1="480" y1="500" x2="720" y2="500" />
  </g>

  <!-- Central Gateway Node -->
  <g transform="translate(600, 200)">
    <rect x="-100" y="-45" width="200" height="90" rx="18" fill="#18142A" stroke="#7C3AED" stroke-width="3" />
    <text x="0" y="-5" font-family="sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">API GATEWAY</text>
    <text x="0" y="18" font-family="sans-serif" font-weight="600" font-size="12" fill="#A78BFA" text-anchor="middle">REST &amp; gRPC Router</text>
  </g>

  <!-- Service Node 1: Auth -->
  <g transform="translate(350, 350)">
    <rect x="-90" y="-40" width="180" height="80" rx="14" fill="#11111E" stroke="#3B82F6" stroke-width="2" />
    <text x="0" y="-5" font-family="sans-serif" font-weight="800" font-size="16" fill="#60A5FA" text-anchor="middle">AUTH SERVICE</text>
    <text x="0" y="15" font-family="sans-serif" font-weight="500" font-size="11" fill="#93C5FD" text-anchor="middle">JWT &amp; OAuth 2.0</text>
  </g>

  <!-- Service Node 2: Orders -->
  <g transform="translate(850, 350)">
    <rect x="-90" y="-40" width="180" height="80" rx="14" fill="#11111E" stroke="#EC4899" stroke-width="2" />
    <text x="0" y="-5" font-family="sans-serif" font-weight="800" font-size="16" fill="#F472B6" text-anchor="middle">ORDER SERVICE</text>
    <text x="0" y="15" font-family="sans-serif" font-weight="500" font-size="11" fill="#FBCFE8" text-anchor="middle">Event Processing</text>
  </g>

  <!-- Service Node 3: Products -->
  <g transform="translate(480, 500)">
    <rect x="-90" y="-40" width="180" height="80" rx="14" fill="#11111E" stroke="#10B981" stroke-width="2" />
    <text x="0" y="-5" font-family="sans-serif" font-weight="800" font-size="16" fill="#34D399" text-anchor="middle">PRODUCT SVC</text>
    <text x="0" y="15" font-family="sans-serif" font-weight="500" font-size="11" fill="#A7F3D0" text-anchor="middle">MongoDB Cluster</text>
  </g>

  <!-- Service Node 4: Payment -->
  <g transform="translate(720, 500)">
    <rect x="-90" y="-40" width="180" height="80" rx="14" fill="#11111E" stroke="#F59E0B" stroke-width="2" />
    <text x="0" y="-5" font-family="sans-serif" font-weight="800" font-size="16" fill="#FBBF24" text-anchor="middle">PAYMENT SVC</text>
    <text x="0" y="15" font-family="sans-serif" font-weight="500" font-size="11" fill="#FDE68A" text-anchor="middle">Stripe Webhooks</text>
  </g>

  <!-- Title Header -->
  <text x="600" y="80" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MICROSERVICE ARCHITECTURE</text>
  <text x="600" y="112" font-family="sans-serif" font-weight="500" font-size="15" fill="#A1A1AA" text-anchor="middle">Scalable Distributed Systems &amp; Independent Services</text>
</svg>
