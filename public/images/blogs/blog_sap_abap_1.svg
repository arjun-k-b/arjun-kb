<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#150E28" />
      <stop offset="100%" stop-color="#090712" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <circle cx="600" cy="337" r="260" fill="#7C3AED" opacity="0.15" filter="url(#glow-effect)" />

  <!-- Code Editor Window -->
  <g transform="translate(600, 350)">
    <rect x="-350" y="-180" width="700" height="340" rx="16" fill="#11101D" stroke="#7C3AED" stroke-width="2.5" />
    
    <!-- Titlebar -->
    <path d="M -350 -180 L 350 -180 A 16 16 0 0 1 350 -130 L -350 -130 Z" fill="#1A182D" />
    <circle cx="-320" cy="-155" r="6" fill="#EF4444" />
    <circle cx="-300" cy="-155" r="6" fill="#F59E0B" />
    <circle cx="-280" cy="-155" r="6" fill="#10B981" />
    <text x="0" y="-148" font-family="monospace" font-weight="700" font-size="14" fill="#A78BFA" text-anchor="middle">Z_SAP_ABAP_FUNDAMENTALS.abap</text>

    <!-- Code Snippet -->
    <text x="-310" y="-90" font-family="monospace" font-size="16" fill="#EC4899">REPORT <tspan fill="#FFFFFF">z_sap_abap_fundamentals.</tspan></text>
    <text x="-310" y="-55" font-family="monospace" font-size="16" fill="#3B82F6">DATA: <tspan fill="#A78BFA">lv_message</tspan> <tspan fill="#60A5FA">TYPE</tspan> <tspan fill="#F59E0B">string.</tspan></text>
    <text x="-310" y="-20" font-family="monospace" font-size="16" fill="#E4E4E7">lv_message = <tspan fill="#10B981">'Welcome to Enterprise SAP ABAP Development!'</tspan>.</text>
    <text x="-310" y="15" font-family="monospace" font-size="16" fill="#EC4899">WRITE: <tspan fill="#FFFFFF">/ lv_message.</tspan></text>

    <!-- SAP ABAP Badge -->
    <rect x="-120" y="65" width="240" height="40" rx="20" fill="#7C3AED" opacity="0.3" stroke="#A78BFA" stroke-width="1.5" />
    <text x="0" y="90" font-family="sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">SAP ABAP MADE SIMPLE</text>
  </g>

  <!-- Header Text -->
  <text x="600" y="85" font-family="sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAP ABAP GUIDE #1</text>
  <text x="600" y="120" font-family="sans-serif" font-weight="500" font-size="16" fill="#A1A1AA" text-anchor="middle">Fundamentals for Modern Developers &amp; Enterprise Architecture</text>
</svg>
