<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#111529" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <circle cx="600" cy="337" r="260" fill="#3B82F6" opacity="0.12" filter="url(#glow-effect)" />

  <!-- Landscape Grid (DEV -> QAS -> PRD) -->
  <g transform="translate(600, 340)">
    <!-- DEV System Box -->
    <g transform="translate(-280, 0)">
      <rect x="-90" y="-80" width="180" height="160" rx="18" fill="#13172E" stroke="#3B82F6" stroke-width="2.5" />
      <text x="0" y="-35" font-family="sans-serif" font-weight="900" font-size="28" fill="#60A5FA" text-anchor="middle">DEV</text>
      <text x="0" y="-5" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Development</text>
      <rect x="-65" y="20" width="130" height="26" rx="13" fill="#3B82F6" opacity="0.2" />
      <text x="0" y="37" font-family="monospace" font-weight="700" font-size="13" fill="#93C5FD" text-anchor="middle">Client 100</text>
    </g>

    <!-- QAS System Box -->
    <g transform="translate(0, 0)">
      <rect x="-90" y="-80" width="180" height="160" rx="18" fill="#17132B" stroke="#7C3AED" stroke-width="2.5" />
      <text x="0" y="-35" font-family="sans-serif" font-weight="900" font-size="28" fill="#C084FC" text-anchor="middle">QAS</text>
      <text x="0" y="-5" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Quality Assurance</text>
      <rect x="-65" y="20" width="130" height="26" rx="13" fill="#7C3AED" opacity="0.2" />
      <text x="0" y="37" font-family="monospace" font-weight="700" font-size="13" fill="#A78BFA" text-anchor="middle">Client 200</text>
    </g>

    <!-- PRD System Box -->
    <g transform="translate(280, 0)">
      <rect x="-90" y="-80" width="180" height="160" rx="18" fill="#1C1222" stroke="#10B981" stroke-width="2.5" />
      <text x="0" y="-35" font-family="sans-serif" font-weight="900" font-size="28" fill="#34D399" text-anchor="middle">PRD</text>
      <text x="0" y="-5" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Production</text>
      <rect x="-65" y="20" width="130" height="26" rx="13" fill="#10B981" opacity="0.2" />
      <text x="0" y="37" font-family="monospace" font-weight="700" font-size="13" fill="#6EE7B7" text-anchor="middle">Client 300</text>
    </g>

    <!-- Transport Flow Arrows -->
    <path d="M -170 0 L -110 0" stroke="#60A5FA" stroke-width="3" fill="none" marker-end="url(#arrow)" />
    <path d="M 110 0 L 170 0" stroke="#C084FC" stroke-width="3" fill="none" marker-end="url(#arrow)" />

    <!-- T-Codes Badges -->
    <g transform="translate(0, 140)">
      <rect x="-240" y="-20" width="100" height="34" rx="8" fill="#1E1E2E" stroke="#444" stroke-width="1" />
      <text x="-190" y="3" font-family="monospace" font-weight="700" font-size="15" fill="#F59E0B" text-anchor="middle">SE38</text>

      <rect x="-120" y="-20" width="100" height="34" rx="8" fill="#1E1E2E" stroke="#444" stroke-width="1" />
      <text x="-70" y="3" font-family="monospace" font-weight="700" font-size="15" fill="#F59E0B" text-anchor="middle">SE80</text>

      <rect x="0" y="-20" width="100" height="34" rx="8" fill="#1E1E2E" stroke="#444" stroke-width="1" />
      <text x="50" y="3" font-family="monospace" font-weight="700" font-size="15" fill="#F59E0B" text-anchor="middle">SE11</text>

      <rect x="120" y="-20" width="100" height="34" rx="8" fill="#1E1E2E" stroke="#444" stroke-width="1" />
      <text x="170" y="3" font-family="monospace" font-weight="700" font-size="15" fill="#F59E0B" text-anchor="middle">SE24</text>
    </g>
  </g>

  <!-- Header -->
  <text x="600" y="85" font-family="sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAP ABAP GUIDE #1.2</text>
  <text x="600" y="120" font-family="sans-serif" font-weight="500" font-size="16" fill="#A1A1AA" text-anchor="middle">SAP GUI, System Landscape &amp; Essential Development Tools</text>
</svg>
