<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#140E24" />
      <stop offset="100%" stop-color="#090710" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <circle cx="600" cy="337" r="260" fill="#10B981" opacity="0.1" filter="url(#glow-effect)" />

  <g transform="translate(600, 340)">
    <!-- Activation / Compile Window -->
    <rect x="-320" y="-170" width="640" height="320" rx="16" fill="#11111E" stroke="#10B981" stroke-width="2.5" />

    <!-- Titlebar -->
    <path d="M -320 -170 L 320 -170 A 16 16 0 0 1 320 -120 L -320 -120 Z" fill="#181829" />
    <text x="-290" y="-140" font-family="monospace" font-weight="700" font-size="14" fill="#34D399">Z_FIRST_REPORT [Active]</text>
    <rect x="200" y="-152" width="100" height="24" rx="12" fill="#10B981" opacity="0.2" />
    <text x="250" y="-136" font-family="sans-serif" font-weight="700" font-size="11" fill="#34D399" text-anchor="middle">ACTIVE</text>

    <!-- Code lines -->
    <text x="-290" y="-80" font-family="monospace" font-size="15" fill="#F472B6">PARAMETERS: <tspan fill="#FFFFFF">p_emp_id</tspan> <tspan fill="#60A5FA">TYPE</tspan> <tspan fill="#F59E0B">char10.</tspan></text>
    <text x="-290" y="-45" font-family="monospace" font-size="15" fill="#F472B6">START-OF-SELECTION.</tspan>
    <text x="-270" y="-10" font-family="monospace" font-size="15" fill="#EC4899">WRITE: <tspan fill="#10B981">'Employee ID:'</tspan>, <tspan fill="#FFFFFF">p_emp_id.</tspan></text>
    <text x="-270" y="25" font-family="monospace" font-size="15" fill="#EC4899">ULINE.</tspan>

    <!-- Output Box -->
    <rect x="-290" y="60" width="580" height="60" rx="8" fill="#0A0914" stroke="#333" stroke-width="1" />
    <text x="-270" y="96" font-family="monospace" font-weight="700" font-size="14" fill="#38BDF8">Output: Employee ID: 10000042</text>
  </g>

  <!-- Header -->
  <text x="600" y="85" font-family="sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAP ABAP GUIDE #1.3</text>
  <text x="600" y="120" font-family="sans-serif" font-weight="500" font-size="16" fill="#A1A1AA" text-anchor="middle">Build, Activate &amp; Execute Your First ABAP Report Program</text>
</svg>
