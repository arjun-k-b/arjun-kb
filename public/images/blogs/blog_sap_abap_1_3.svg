<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#180F33" />
      <stop offset="100%" stop-color="#0A0714" />
    </linearGradient>
    <linearGradient id="active-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Ambient Glow circles -->
  <circle cx="600" cy="337" r="280" fill="#7C3AED" opacity="0.15" filter="url(#glow-effect)" />
  <circle cx="350" cy="400" r="180" fill="#10B981" opacity="0.12" filter="url(#glow-effect)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200" />
    <path d="M240 0 V675 M480 0 V675 M720 0 V675 M960 0 V675" />
  </g>

  <!-- Central ABAP Report Development Window -->
  <g transform="translate(600, 350)">
    <rect x="-350" y="-175" width="700" height="330" rx="18" fill="#121022" stroke="#7C3AED" stroke-width="2.5" />

    <!-- Window Titlebar -->
    <path d="M -350 -175 L 350 -175 A 18 18 0 0 1 350 -125 L -350 -125 Z" fill="#1A1730" />
    <circle cx="-320" cy="-150" r="6" fill="#EF4444" />
    <circle cx="-300" cy="-150" r="6" fill="#F59E0B" />
    <circle cx="-280" cy="-150" r="6" fill="#10B981" />
    <text x="-250" y="-144" font-family="monospace" font-weight="700" font-size="13" fill="#A78BFA">SE38 Editor: Z_FIRST_ABAP_REPORT [Active]</text>

    <!-- Active Badge -->
    <rect x="230" y="-160" width="90" height="22" rx="11" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="275" y="-145" font-family="sans-serif" font-weight="700" font-size="10" fill="#34D399" text-anchor="middle">ACTIVE</text>

    <!-- ABAP Code Statements -->
    <text x="-310" y="-85" font-family="monospace" font-size="15" fill="#EC4899">REPORT <tspan fill="#FFFFFF">z_first_abap_report.</tspan></text>
    <text x="-310" y="-52" font-family="monospace" font-size="15" fill="#3B82F6">PARAMETERS: <tspan fill="#A78BFA">p_emp_id</tspan> <tspan fill="#60A5FA">TYPE</tspan> <tspan fill="#F59E0B">char10.</tspan></text>
    <text x="-310" y="-19" font-family="monospace" font-size="15" fill="#EC4899">START-OF-SELECTION.</tspan>
    <text x="-290" y="14" font-family="monospace" font-size="15" fill="#EC4899">WRITE: <tspan fill="#10B981">'Employee Record:'</tspan>, <tspan fill="#FFFFFF">p_emp_id.</tspan></text>
    <text x="-290" y="47" font-family="monospace" font-size="15" fill="#EC4899">ULINE.</tspan>

    <!-- Output Box Console -->
    <rect x="-310" y="75" width="620" height="55" rx="8" fill="#0A0914" stroke="#332D4D" stroke-width="1.5" />
    <text x="-290" y="108" font-family="monospace" font-weight="700" font-size="14" fill="#38BDF8">Output: Employee Record: 10000042</text>
  </g>

  <!-- Top Header Title -->
  <text x="600" y="80" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SAP ABAP GUIDE #1.3</text>
  <text x="600" y="112" font-family="sans-serif" font-weight="500" font-size="15" fill="#A1A1AA" text-anchor="middle">Create, Activate &amp; Execute Your First ABAP Report Program</text>
</svg>
