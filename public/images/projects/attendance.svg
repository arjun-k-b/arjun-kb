<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B12" />
      <stop offset="50%" stop-color="#13111C" />
      <stop offset="100%" stop-color="#07060A" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Glow effects -->
  <circle cx="600" cy="337" r="220" fill="#7C3AED" opacity="0.15" filter="url(#blur-glow)" />
  <circle cx="350" cy="250" r="180" fill="#06B6D4" opacity="0.1" filter="url(#blur-glow)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200" />
    <path d="M240 0 V675 M480 0 V675 M720 0 V675 M960 0 V675" />
  </g>

  <!-- ESP32 & RFID System Illustration -->
  <g transform="translate(600, 337)">
    <!-- RFID Waves -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="url(#purple-glow)" stroke-width="2" opacity="0.2" stroke-dasharray="10 15" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#purple-glow)" stroke-width="3" opacity="0.4" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#cyan-glow)" stroke-width="4" opacity="0.7" />

    <!-- ESP32 Chip Body -->
    <rect x="-110" y="-80" width="220" height="160" rx="16" fill="#181825" stroke="#7C3AED" stroke-width="3" />
    <rect x="-90" y="-60" width="180" height="120" rx="10" fill="#0F0E17" stroke="#332D4D" stroke-width="1.5" />

    <!-- Chip Text / Branding -->
    <text x="0" y="-20" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ESP32 RFID</text>
    <text x="0" y="8" font-family="sans-serif" font-weight="600" font-size="14" fill="#A78BFA" text-anchor="middle">ATTENDANCE SYSTEM</text>

    <!-- Status Indicator -->
    <rect x="-60" y="26" width="120" height="24" rx="12" fill="#059669" opacity="0.2" stroke="#10B981" stroke-width="1.5" />
    <circle cx="-42" cy="38" r="4" fill="#10B981" />
    <text x="4" y="43" font-family="sans-serif" font-weight="700" font-size="11" fill="#34D399" text-anchor="middle">ACCESS GRANTED</text>

    <!-- Pin Headers -->
    <g fill="#A1A1AA">
      <circle cx="-100" cy="-60" r="3" /><circle cx="-100" cy="-40" r="3" /><circle cx="-100" cy="-20" r="3" /><circle cx="-100" cy="0" r="3" /><circle cx="-100" cy="20" r="3" /><circle cx="-100" cy="40" r="3" /><circle cx="-100" cy="60" r="3" />
      <circle cx="100" cy="-60" r="3" /><circle cx="100" cy="-40" r="3" /><circle cx="100" cy="-20" r="3" /><circle cx="100" cy="0" r="3" /><circle cx="100" cy="20" r="3" /><circle cx="100" cy="40" r="3" /><circle cx="100" cy="60" r="3" />
    </g>

    <!-- RFID Card Icon floating -->
    <g transform="translate(240, -60) rotate(12)">
      <rect x="-70" y="-45" width="140" height="90" rx="10" fill="#1E1B2E" stroke="#A78BFA" stroke-width="2" />
      <rect x="-55" y="-30" width="30" height="24" rx="4" fill="#F59E0B" />
      <text x="0" y="25" font-family="sans-serif" font-weight="700" font-size="12" fill="#E4E4E7" text-anchor="middle">SMART CARD</text>
    </g>
  </g>
</svg>
